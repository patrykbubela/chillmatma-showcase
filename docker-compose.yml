name: chillmatma

services:
  chillmatma-django:
    build:
      target: prod
    container_name: chillmatma_django
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 100
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    env_file:
      - .env
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
      - /dev/shm:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    volumes:
      - db_volume:/app/db
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./import:/app/import
      - ./export:/app/export
    networks:
      - backend
    profiles: [prod]

  nginx:
    image: nginx/nginx-unprivileged:1.31.9-alpine@sha256:60214a103e6f38e953ff957f34b1f2e97a9db801ab2df3821da955d0fe6cadd6
    container_name: chillmatma_nginx
    user: "101:101"
    restart: unless-stopped
    read_only: true
    depends_on:
      - chillmatma-django
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 100
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=101,gid=101
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=16m,uid=101,gid=101
    volumes:
      - ./nginx/chillmatma.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    networks:
      - frontend
      - backend
    profiles: [prod]

  cloudflared:
    image: cloudflare/cloudflared:2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    container_name: chillmatma_tunnel
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    command: tunnel run
    depends_on:
      - nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 100
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
    networks:
      - frontend
    profiles: [prod]

  chillmatma-django-dev:
    build:
      target: dev
    container_name: chillmatma_django_dev
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    volumes:
      - .:/app
      - ./media:/app/media
      - ./db:/app/db
      - ./staticfiles:/app/staticfiles
    profiles: [dev]
    
  nginx-dev:
    image: nginx/nginx-unprivileged:1.31.9-alpine@sha256:60214a103e6f38e953ff957f34b1f2e97a9db801ab2df3821da955d0fe6cadd6
    container_name: chillmatma_nginx_dev
    restart: unless-stopped
    depends_on:
      - chillmatma-django-dev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./nginx/chillmatma.dev.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    ports:
      - "127.0.0.1:8000:8080"
    profiles: [dev]

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  db_volume:
  static_volume:
  media_volume:
