log_format private '[$time_local] ' '"$request" $status $body_bytes_sent ';

server {
    listen 8080;
    server_name chillmatma.pl www.chillmatma.pl;

    server_tokens off;

    client_max_body_size 50M;

    access_log /var/log/nginx/access.log private;
    error_log /var/log/nginx/error.log crit;

    location /static/ {
        alias /app/staticfiles/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /media/ {
        alias /app/media/;
        add_header Cache-Control "public, no-cache";
    }

    location / {
        proxy_pass http://chillmatma-django:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location = /favicon.ico {
        root /app/staticfiles/img;
        add_header Cache-Control "public, no-cache";
    }

    location = /static/staticfiles.json {
        return 404;
    }
}
